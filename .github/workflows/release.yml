name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Build macOS installers
        run: ./scripts/build-macos-installers.sh
      # Public macOS packages are signed, notarized, and uploaded from the
      # release Mac. Do not replace them with ad-hoc CI packages.

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/windows-release -G "Visual Studio 17 2022" -A x64 -DAURELINE_BUILD_STANDALONE=ON -DAURELINE_BUILD_PLUGINS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/windows-release --config Release --target Aureline_Plugin_Standalone Aureline_Plugin_VST3 aureline_engine_tests
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-release -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist/Aureline-Windows | Out-Null
          Copy-Item build/windows-release/Aureline_Plugin_artefacts/Release/Standalone/Aureline.exe dist/Aureline-Windows/
          Copy-Item -Recurse build/windows-release/Aureline_Plugin_artefacts/Release/VST3/Aureline.vst3 dist/Aureline-Windows/
          Compress-Archive -Path dist/Aureline-Windows/* -DestinationPath "dist/Aureline-$version-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Aureline-*-Windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Aureline ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
