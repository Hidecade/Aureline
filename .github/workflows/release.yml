name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Build macOS installers
        run: ./scripts/build-macos-installers.sh
      # Public macOS packages are signed, notarized, and uploaded from the
      # release Mac. Do not replace them with ad-hoc CI packages.

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Aureline-*-Windows-x64-Setup.exe
            dist/Aureline-*-Windows-x64-Setup.exe.sha256

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Aureline ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
