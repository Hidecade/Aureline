name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Build macOS installers
        run: ./scripts/build-macos-installers.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: dist/*.pkg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/windows-release -G "Visual Studio 17 2022" -A x64 -DAURELINE_BUILD_STANDALONE=ON -DAURELINE_BUILD_PLUGINS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/windows-release --config Release --target Aureline_Standalone Aureline_Plugin_VST3
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-release -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Aureline-Windows | Out-Null
          Copy-Item build/windows-release/Aureline_Standalone_artefacts/Release/Aureline.exe dist/Aureline-Windows/
          Copy-Item -Recurse build/windows-release/Aureline_Plugin_artefacts/Release/VST3/Aureline.vst3 dist/Aureline-Windows/
          Compress-Archive -Path dist/Aureline-Windows/* -DestinationPath "dist/Aureline-1.0.1-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Aureline-1.0.1-Windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Aureline v1.0.1
          generate_release_notes: true
          files: release-assets/*
